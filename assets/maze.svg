<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 392" width="100%" role="img" aria-labelledby="t d">
<title id="t">A maze solved by breadth-first search</title>
<desc id="d">A maze of 240 cells. A search spreads outward from the green start square, lighting each cell as it is visited, until it reaches the red goal. The shortest route is then traced in yellow.</desc>
<defs><style>
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
.c { fill: #1f6feb; opacity: .34; animation: c 12s linear infinite backwards; }
@keyframes c { 0% { opacity: 0; fill: #a5d6ff; } 1.2% { opacity: 1; fill: #a5d6ff; } 6% { opacity: .34; fill: #1f6feb; } 84% { opacity: .34; fill: #1f6feb; } 89%, 100% { opacity: 0; fill: #1f6feb; } }
.p { fill: none; stroke: #f2cc60; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; animation: p 12s linear infinite; }
@keyframes p { 0%, 36.7% { stroke-dashoffset: 1; opacity: 0; } 37.0% { stroke-dashoffset: 1; opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); } 50.7%, 84% { stroke-dashoffset: 0; opacity: 1; } 88%, 100% { stroke-dashoffset: 0; opacity: 0; } }
.end { transform-box: fill-box; transform-origin: center; animation: end 12s ease-out infinite; }
@keyframes end { 0%, 36.7% { transform: scale(1); } 38.7% { transform: scale(1.5); } 42.7%, 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .c, .p, .end { animation: none; } }
</style></defs>
